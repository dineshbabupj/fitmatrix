<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      width: 1200px;
      height: 800px;
      background: radial-gradient(circle at top right, #1a2f23 0%, #020408 100%);
      font-family: 'Inter', sans-serif;
      color: white;
      overflow: hidden;
      position: relative;
    }

    /* Background Elements */
    .glow-circle {
      position: absolute;
      width: 600px;
      height: 600px;
      background: rgba(74, 222, 128, 0.15);
      border-radius: 50%;
      filter: blur(100px);
      top: -100px;
      right: -100px;
      z-index: 0;
    }

    /* Content Layout */
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      height: 100%;
      align-items: center;
      padding: 0 80px;
    }

    .text-section {
      flex: 1;
      padding-right: 40px;
    }

    .badge {
      display: inline-block;
      background: rgba(74, 222, 128, 0.2);
      border: 1px solid rgba(74, 222, 128, 0.4);
      color: #4ADE80;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 80px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title span {
      background: linear-gradient(135deg, #4ADE80 0%, #16A34A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 26px;
      color: #9CA3AF;
      line-height: 1.5;
      margin-bottom: 40px;
      max-width: 500px;
    }

    .tech-stack {
      display: flex;
      gap: 12px;
    }

    .tech-pill {
      background: #1F2937;
      border: 1px solid #374151;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      color: #E5E7EB;
    }

    .visual-section {
      flex: 1;
      position: relative;
      height: 100%;
    }

    /* Device Mockups */
    .device {
      position: absolute;
      width: 320px;
      height: 680px;
      background: #111827;
      border: 8px solid #1F2937;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: -20px 30px 60px rgba(0,0,0,0.6);
    }

    .device-1 {
      top: 100px;
      right: 180px;
      transform: rotate(-5deg);
      z-index: 2;
    }

    .device-2 {
      top: 140px;
      right: -20px;
      transform: rotate(5deg) scale(0.9);
      z-index: 1;
      opacity: 0.8;
      box-shadow: -10px 20px 40px rgba(0,0,0,0.5);
    }

    .screen {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="glow-circle"></div>
  
  <div class="container">
    <div class="text-section">
      <div class="badge">FEATURED PROJECT</div>
      <div class="title">FitMetrics<br><span>Offline App</span></div>
      <div class="subtitle">A blazing-fast, privacy-first health & workout tracker built with React Native.</div>
      <div class="tech-stack">
        <div class="tech-pill">React Native</div>
        <div class="tech-pill">Expo</div>
        <div class="tech-pill">SQLite</div>
      </div>
    </div>
    
    <div class="visual-section">
      <div class="device device-2">
        <img src="fresh_bmr.png" class="screen">
      </div>
      <div class="device device-1">
        <img src="fresh_bmi.png" class="screen">
      </div>
    </div>
  </div>
</body>
</html>
