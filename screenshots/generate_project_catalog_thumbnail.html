<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@800;900&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      width: 1200px;
      height: 800px;
      background: linear-gradient(135deg, #09090b 0%, #18181b 100%);
      font-family: 'Inter', sans-serif;
      color: white;
      overflow: hidden;
      position: relative;
    }

    /* Abstract shapes for background */
    .shape-1 {
      position: absolute;
      width: 800px;
      height: 800px;
      background: rgba(16, 185, 129, 0.15); /* Emerald glow */
      border-radius: 50%;
      filter: blur(120px);
      top: -200px;
      right: -200px;
    }
    
    .shape-2 {
      position: absolute;
      width: 600px;
      height: 600px;
      background: rgba(59, 130, 246, 0.15); /* Blue glow */
      border-radius: 50%;
      filter: blur(120px);
      bottom: -200px;
      left: -200px;
    }

    .container {
      position: relative;
      z-index: 10;
      display: flex;
      height: 100%;
      padding: 60px 80px;
      align-items: center;
    }

    /* Left Content (Text & Selling Points) */
    .left-col {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(90deg, #10B981 0%, #059669 100%);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      align-self: flex-start;
      margin-bottom: 30px;
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 75px;
      font-weight: 900;
      line-height: 1.05;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .title span.react { color: #61DAFB; }
    .title span.native { color: #10B981; }

    .subtitle {
      font-size: 24px;
      color: #A1A1AA;
      margin-bottom: 40px;
      line-height: 1.4;
      font-weight: 500;
    }

    /* Bullet points for Gig features */
    .features-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 22px;
      font-weight: 600;
      color: #E4E4E7;
      background: rgba(255,255,255,0.05);
      padding: 16px 24px;
      border-radius: 12px;
      border-left: 4px solid #10B981;
    }
    
    .feature-item span.icon {
      font-size: 24px;
    }

    /* Right Content (Phones) */
    .right-col {
      flex: 0.9;
      position: relative;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .device {
      position: absolute;
      width: 320px;
      height: 680px;
      background: #111827;
      border: 8px solid #27272A;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: -20px 40px 80px rgba(0,0,0,0.8);
    }

    .device-front {
      z-index: 5;
      transform: translateY(20px) rotate(-3deg);
    }

    .device-back {
      z-index: 1;
      transform: translate(120px, -40px) rotate(6deg) scale(0.9);
      opacity: 0.7;
      box-shadow: -10px 20px 50px rgba(0,0,0,0.5);
    }

    .screen {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Tech icons row at bottom */
    .tech-row {
      position: absolute;
      bottom: 60px;
      left: 80px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .tech-pill {
      background: #18181B;
      border: 1px solid #3F3F46;
      color: #D4D4D8;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

  </style>
</head>
<body>
  <div class="shape-1"></div>
  <div class="shape-2"></div>
  
  <div class="container">
    <div class="left-col">
      <div class="badge">PRO APP DEVELOPMENT</div>
      <div class="title">I will build your<br><span class="react">React Native</span> <span class="native">Mobile App</span></div>
      <div class="subtitle">iOS & Android applications built with Expo, ready for the App Store & Google Play.</div>
      
      <div class="features-list">
        <div class="feature-item"><span class="icon">🚀</span> High-Performance & Offline Ready</div>
        <div class="feature-item"><span class="icon">🎨</span> Custom Pixel-Perfect UI Design</div>
        <div class="feature-item"><span class="icon">☁️</span> Database & API Integration</div>
      </div>
    </div>
    
    <div class="right-col">
      <div class="device device-back">
        <img src="fresh_bmr.png" class="screen">
      </div>
      <div class="device device-front">
        <img src="fresh_idealweight.png" class="screen">
      </div>
    </div>
  </div>

  <div class="tech-row">
    <div class="tech-pill">Expo SDK</div>
    <div class="tech-pill">TypeScript</div>
    <div class="tech-pill">Firebase / Supabase</div>
  </div>
</body>
</html>
